[project]
name = "omniparser-eval"
version = "0.1.0a1"
description = "Benchmark harnesses (ScreenSpot-Pro, etc.) for OmniParser."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "OmniParser Monorepo Maintainers" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "omniparser-core",
  "openai>=1.50",
  "datasets>=3.0",
  "huggingface_hub>=0.24",
  "pillow>=10.0",
  "tqdm>=4.66",
]

[project.scripts]
omniparser-eval = "omniparser_eval.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniparser_eval"]
