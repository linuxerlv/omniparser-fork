[project]
name = "omniparser-core"
version = "0.1.0a1"
description = "Pure inference library: pluggable detector + caption + OCR backends with IoU dedup pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "OmniParser Monorepo Maintainers" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core install: zero ML dependencies. Only Pillow + numpy + opencv for
# geometry/annotation. Detectors, captioners, and OCR backends are opt-in
# via extras to (a) keep the import path < 500 ms and (b) isolate the
# AGPL-3.0 surface area introduced by Ultralytics YOLO.
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
# Ultralytics is AGPL-3.0; see WEIGHTS_LICENSE.md.
yolo = [
  "torch>=2.4",
  "torchvision>=0.19",
  "ultralytics>=8.3,<9",
  "supervision>=0.18",
]
# Florence-2 / BLIP-2 / Phi-3-V captioners.
caption = [
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.45",
  "huggingface-hub>=0.20",
  "einops>=0.8",
  "timm>=1.0",
]
easyocr = [
  "easyocr>=1.7",
]
paddleocr = [
  "paddleocr>=2.7",
  "paddlepaddle>=2.6",
]
all = [
  "omniparser-core[yolo,caption,easyocr,paddleocr]",
]

[project.urls]
Homepage      = "https://github.com/microsoft/OmniParser"
Repository    = "https://github.com/microsoft/OmniParser"
Documentation = "https://microsoft.github.io/OmniParser/"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniparser"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
