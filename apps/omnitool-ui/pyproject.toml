[project]
name = "omnitool-ui"
version = "0.1.0a1"
description = "Gradio agent UI driving omnitool-agent."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "OmniParser Monorepo Maintainers" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "omnitool-agent",
  "omniparser-client",
  "gradio>=5.0",
  "anthropic>=0.40",
  "groq>=0.13",
  "Pillow>=10.4",
  "requests>=2.32",
]

[project.scripts]
omnitool-ui = "omnitool_ui.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnitool_ui"]
