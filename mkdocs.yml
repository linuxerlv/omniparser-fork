site_name: OmniParser Monorepo
site_description: Engineering-grade reorganization of microsoft/OmniParser (v2.0.1) into a Python uv-workspace monorepo.
site_url: https://linuxerlv.github.io/omniparser-fork/
repo_name: linuxerlv/omniparser-fork
repo_url: https://github.com/linuxerlv/omniparser-fork
edit_uri: edit/main/docs/

# Strict build: fail on broken links, missing nav entries, etc.
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/linuxerlv/omniparser-fork
    - icon: fontawesome/brands/python
      link: https://pypi.org/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/omniparser-core/src
            - packages/omniparser-client/src
            - packages/omniparser-server/src
            - packages/omniparser-eval/src
            - packages/omnitool-agent/src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Internal:
      - Migration plan: internal/migration-plan.md

# Treat unrecognized config keys as errors (in addition to --strict).
validation:
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: warn
