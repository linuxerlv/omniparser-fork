# Workspace root for the OmniParser monorepo.
# This file is a virtual workspace; it is NOT installed as a package.
# Member packages live under packages/* and apps/* and have their own pyproject.toml.

[project]
name = "ominpaser-workspace"
version = "0.0.0"
description = "Engineering-grade reorganization of microsoft/OmniParser"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "OmniParser Monorepo Maintainers" }]

# Workspace root has no runtime dependencies; members declare their own.
dependencies = []

[tool.uv]
package = false                                  # Do not install the root itself.

[tool.uv.workspace]
members = [
  "packages/omniparser-core",
  "packages/omniparser-client",
  "packages/omniparser-server",
  "packages/omniparser-eval",
  "packages/omnitool-agent",
  "apps/parser-demo",
  "apps/omnitool-ui",
]
exclude = [
  "upstream",                                    # Pinned reference clone, not part of the build.
  "infra/**",                                    # Infrastructure (omnibox VM) is not Python.
]

# Internal cross-package dependencies must be marked workspace-local so uv
# resolves them from this tree and not from PyPI.
[tool.uv.sources]
omniparser-core   = { workspace = true }
omniparser-client = { workspace = true }
omniparser-server = { workspace = true }
omniparser-eval   = { workspace = true }
omnitool-agent    = { workspace = true }

# PEP 735 dependency groups, shared across the workspace via `uv sync --group`.
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3.6",
  "hypothesis>=6.115",
  "ruff>=0.15.17",
  "mypy>=1.15",
  "pre-commit>=4.0",
  "pip-audit>=2.10",
  "cyclonedx-bom>=5.0",
  "towncrier>=24.8",
  "httpx>=0.27",
  "respx>=0.21",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]
benchmarks = [
  "pytest-benchmark>=5.0",
]

# ----------------------------------------------------------------------------
# Shared tool configuration (members may override).
# ----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",                     # Required for src layout in monorepos.
  "-ra",
]
testpaths = ["packages", "apps"]
markers = [
  "slow: marks tests requiring model weights or GPU",
  "benchmark: ScreenSpot-Pro and other benchmark suites (opt-in)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:torch.*",
  "ignore::DeprecationWarning:transformers.*",
]

[tool.coverage.run]
branch = true
source = ["packages", "apps"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# ----------------------------------------------------------------------------
# mypy strict — public packages enforce strict typing; apps are relaxed.
# Optional ML dependencies (torch/transformers/ultralytics/easyocr/paddleocr)
# are imported lazily inside functions for the plugin architecture, so they
# may legitimately be missing at typecheck time. We mark them as
# `ignore_missing_imports` rather than weakening strict mode globally.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_unimported = false  # Tolerate Any flowing in from untyped extras.
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "torch.*",
  "torchvision.*",
  "transformers.*",
  "ultralytics.*",
  "easyocr.*",
  "paddleocr.*",
  "supervision.*",
  "cv2.*",
  "einops.*",
  "timm.*",
  "gradio.*",
]
ignore_missing_imports = true

# Tests are allowed to be loose: we want the spec to read clearly, not the
# typing exhaustively. Strict mode still applies to source.
[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true


[tool.towncrier]
package = "omniparser"
filename = "CHANGELOG.md"
directory = "changes"
issue_format = "[#{issue}](https://github.com/microsoft/OmniParser/issues/{issue})"
title_format = "## [{version}] - {project_date}"

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals & Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
